services:
  - type: web
    name: farmer-marketplace-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://farmer-marketplace-nine.vercel.app,http://localhost:5173
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
